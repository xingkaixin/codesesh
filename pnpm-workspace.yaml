packages:
  - "packages/*"
  - "apps/*"

catalog:
  "@fontsource-variable/ibm-plex-sans": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@fontsource-variable/space-grotesk": ^5.3.0
  "@hugeicons/core-free-icons": ^4.3.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": 22.20.1
  "@typescript/native": npm:typescript@^7.0.2
  better-sqlite3: ^13.0.3
  tailwindcss: ^4.3.3
  tsup: ^8.5.1
  typescript: npm:@typescript/typescript6@^6.0.2
  vite: ^8.2.2

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.0.0"
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - "vitest@5.0.0"

# eslint-plugin-astro 3 requires ESLint 10 while its jsx-a11y peer has not yet
# widened its compatible peer range. Keep the exception scoped to that edge.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "10"

overrides:
  "esbuild@>=0.27.3 <0.28.1": "0.28.2"
  "nanoid@<3.3.18": "^3.3.18"
