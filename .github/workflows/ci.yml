name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same PR branch; keep every run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify quality task coverage
        run: node scripts/check-quality-task-coverage.mjs

      - run: pnpm lint

      - run: pnpm format:check

      - name: Typecheck e2e and root test configs
        run: pnpm typecheck:e2e

      - name: Verify package versions agree
        run: node scripts/release-preflight.mjs

      - name: Verify documented paths exist
        run: node scripts/check-docs-paths.mjs

      # Growth-rate checks only; wall-clock benchmarks stay out of PR CI.
      - name: Check algorithmic growth rates
        if: matrix.node-version == 24
        run: pnpm perf:check

      - run: pnpm build

      - name: Verify documented repository facts
        run: node scripts/check-docs-facts.mjs

      - name: Smoke test CLI on minimum Node version
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: node packages/cli/dist/index.js --version

      # `pnpm clean` is a documented command, so it has to work on every OS we
      # claim to support — including a shell with no `rm`.
      - name: Smoke test clean and rebuild
        if: matrix.node-version == 24
        run: |
          node -e "require('node:fs').writeFileSync('packages/core/dist/clean-sentinel.txt','x')"
          pnpm clean
          node -e "if (require('node:fs').existsSync('packages/core/dist')) { console.error('dist survived pnpm clean'); process.exit(1) }"
          pnpm build

      - run: pnpm test

  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:coverage

      - run: pnpm test:migration

      - name: Enforce the initial bundle budget
        run: pnpm --filter @codesesh/web test:bundle

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  package-artifact:
    name: Package artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm package:artifact:test

      - run: pnpm package:artifact

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: artifacts/npm/
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    name: Package smoke (Node ${{ matrix.node-version }})
    needs: package-artifact
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm

      - run: node scripts/smoke-package-artifact.mjs artifacts/npm/codesesh-*.tgz
