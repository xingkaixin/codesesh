name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - name: Verify package versions agree
        run: node scripts/release-preflight.mjs

      - name: Verify documented paths exist
        run: node scripts/check-docs-paths.mjs

      # Growth-rate checks only; wall-clock benchmarks stay out of PR CI.
      - name: Check algorithmic growth rates
        if: matrix.node-version == 24
        run: pnpm perf:check

      - run: pnpm build

      - name: Smoke test CLI on minimum Node version
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: node packages/cli/dist/index.js --version

      # `pnpm clean` is a documented command, so it has to work on every OS we
      # claim to support — including a shell with no `rm`.
      - name: Smoke test clean and rebuild
        if: matrix.node-version == 24
        run: |
          node -e "require('node:fs').writeFileSync('packages/core/dist/clean-sentinel.txt','x')"
          pnpm clean
          node -e "if (require('node:fs').existsSync('packages/core/dist')) { console.error('dist survived pnpm clean'); process.exit(1) }"
          pnpm build

      - run: pnpm test

  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:coverage

      - run: pnpm test:migration

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
