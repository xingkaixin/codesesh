name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify quality task coverage
        run: node scripts/check-quality-task-coverage.mjs

      - run: pnpm lint

      - run: pnpm format:check

      - name: Typecheck e2e and root test configs
        run: pnpm typecheck:e2e

      - name: Verify package versions agree
        run: node scripts/release-preflight.mjs

      - name: Verify documented paths exist
        run: node scripts/check-docs-paths.mjs

      # Growth-rate checks only; wall-clock benchmarks stay out of PR CI.
      - name: Check algorithmic growth rates
        if: matrix.node-version == 24
        run: pnpm perf:check

      - run: pnpm build

      - name: Verify documented repository facts
        run: node scripts/check-docs-facts.mjs

      - name: Smoke test CLI on minimum Node version
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: node packages/cli/dist/index.js --version

      # `pnpm clean` is a documented command, so it has to work on every OS we
      # claim to support — including a shell with no `rm`.
      - name: Smoke test clean and rebuild
        if: matrix.node-version == 24
        run: |
          node -e "require('node:fs').writeFileSync('packages/core/dist/clean-sentinel.txt','x')"
          pnpm clean
          node -e "if (require('node:fs').existsSync('packages/core/dist')) { console.error('dist survived pnpm clean'); process.exit(1) }"
          pnpm build

      - run: pnpm test

  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:coverage

      - run: pnpm test:migration

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  package-artifact:
    name: Package artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm package:artifact:test

      - run: pnpm package:artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: artifacts/npm/
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    name: Package smoke (Node ${{ matrix.node-version }})
    needs: package-artifact
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: artifacts/npm

      - run: node scripts/smoke-package-artifact.mjs artifacts/npm/codesesh-*.tgz
