name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Before anything is built, rewritten or published: the tag and all four
      # manifests must already agree.
      - name: Verify release versions
        run: node scripts/release-preflight.mjs "${GITHUB_REF_NAME}"

      - name: Build npm artifact
        run: pnpm package:artifact

      - name: Smoke test npm artifact
        run: node scripts/smoke-package-artifact.mjs "artifacts/npm/codesesh-${GITHUB_REF_NAME#v}.tgz"

      - name: Publish to npm
        run: npm publish "artifacts/npm/codesesh-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
