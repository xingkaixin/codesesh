name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Before anything is built, rewritten or published: the tag and all four
      # manifests must already agree.
      - name: Verify release versions
        run: node scripts/release-preflight.mjs "${GITHUB_REF_NAME}"

      - name: Build npm artifact
        run: pnpm package:artifact

      - name: Smoke test npm artifact
        run: node scripts/smoke-package-artifact.mjs "artifacts/npm/codesesh-${GITHUB_REF_NAME#v}.tgz"

      - name: Publish to npm
        run: npm publish "artifacts/npm/codesesh-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
