name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Before anything is built, rewritten or published: the tag and all four
      # manifests must already agree.
      - name: Verify release versions
        run: node scripts/release-preflight.mjs "${GITHUB_REF_NAME}"

      - name: Build npm artifact
        run: pnpm package:artifact

      - name: Smoke test npm artifact
        run: node scripts/smoke-package-artifact.mjs "artifacts/npm/codesesh-${GITHUB_REF_NAME#v}.tgz"

      - name: Publish to npm
        run: npm publish "artifacts/npm/codesesh-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
